# SG2 edge configuration for ordo.mossdeck.com — DEPLOYED 2026-11-09.
#
# Authoritative copies live in the my-docker-composes repo (mirrors live SG2):
#   sg2/edge/conf.d/ordo.conf        -> /opt/nginx/conf.d/ordo.conf
#   sg2/edge/conf.d/ordo-acme.conf   -> /opt/nginx/conf.d/ordo-acme.conf
#   sg2/edge/stream.d/shared-443.conf -> /opt/nginx/stream.d/shared-443.conf
#
# SG2 edge model: public 443 is a single nginx stream listener doing
# ssl_preread SNI dispatch. Each site terminates TLS on a dedicated loopback
# port (ordo = 127.0.0.1:18515), then proxies to the backend over the
# cn1-sg2 AmneziaWG tunnel. TLS uses the shared cert at
# /etc/letsencrypt/live/123541.xyz (SAN includes *.mossdeck.com).

upstream ordo_backend {
    zone ordo_backend 64k;
    server 10.66.70.2:50008 max_fails=1 fail_timeout=30s;
    keepalive 16;
}

server {
    listen 127.0.0.1:18515 ssl;
    http2 on;
    server_name ordo.123541.xyz ordo.mossdeck.com;

    ssl_certificate     /etc/letsencrypt/live/123541.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/123541.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 512m;

    location / {
        proxy_pass http://ordo_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        # Ordo streams workflow run events (SSE); do not buffer upstream.
        proxy_buffering off;
    }
}
